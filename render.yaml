services:
  - type: web
    name: aoa-api
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run alembic upgrade head && uv run uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: PATRONUS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMBED_DIM
        value: "256"
