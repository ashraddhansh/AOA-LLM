services:
  - type: web
    name: aoa-api
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync
    startCommand: uv run alembic upgrade head && uv run uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GENERATION_MODEL
        value: openai/gpt-oss-20b
      - key: GENERATION_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GENERATION_API_KEY
        sync: false
      - key: VERIFICATION_MODEL
        value: openai/gpt-oss-20b
      - key: VERIFICATION_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: VERIFICATION_API_KEY
        sync: false
      - key: WEB_GENERATION_MODEL
        value: openai/gpt-oss-20b
      - key: SERPAPI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMBED_DIM
        value: "256"
